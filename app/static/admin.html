<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EvoHarnessAlert 控制台</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><div><h1>EvoHarnessAlert</h1><span>运维告警处理控制台</span></div><div class="top-actions"><span id="activeAccount">-</span><button id="refreshAdmin">刷新</button><button id="logout">退出</button></div></header><main class="layout"><section class="metrics"><div><b id="metricAlerts">0</b><span>总告警</span></div><div><b id="metricOpen">0</b><span>未恢复</span></div><div><b id="metricP12">0</b><span>P0/P1/P2 事件</span></div><div><b id="metricNotify">0</b><span>通知成功</span></div><div><b id="metricDead">0</b><span>死信任务</span></div></section><section class="composer"><h2>投递测试告警</h2><form id="alertForm"><input id="title" placeholder="告警标题" value="API 错误率过高"><select id="severity"><option value="P0">P0 / 最高</option><option value="P1">P1 / 高</option><option value="P2" selected>P2 / 中</option><option value="P3">P3 / 低</option></select><select id="alertType"><option value="problem">Problem 问题</option><option value="business">Business 业务</option><option value="event">Event 事件</option><option value="host">Host 主机</option></select><input id="service" placeholder="服务名" value="checkout-api"><input id="instance" placeholder="实例" value="pod-1"><button>发送告警</button></form><p id="sendState"></p></section><section class="grid"><article><h2>活跃事件</h2><div id="incidents" class="list"></div></article><article><h2>最新告警</h2><div id="alerts" class="list"></div></article><article><h2>通知记录</h2><div id="notifications" class="list"></div></article><article><h2>队列任务</h2><div id="jobs" class="list"></div></article><article><h2>Agent 研判</h2><div id="traces" class="list"></div></article><article><h2>死信任务</h2><div id="deadLetters" class="list"></div></article></section></main><script src="/admin.js"></script></body></html>
