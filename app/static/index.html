<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EvoHarnessAlert · 运维控制台</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/console/styles.css"><link rel="stylesheet" href="/console/business.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="/" aria-label="EvoHarnessAlert 首页"><span class="brand-mark"><i data-lucide="activity"></i></span><span class="brand-name">EvoHarness<span>ALERT OPERATIONS</span></span></a><div class="workspace"><span class="workspace-icon">团</span><div>团购交易<span>运维工作空间</span></div></div><div class="nav-label">工作空间</div><nav><button data-view="alerts" title="告警工作台"><i data-lucide="panels-top-left"></i><span>告警工作台</span></button><button data-view="dataset" title="回放数据集"><i data-lucide="database"></i><span>回放数据集</span></button></nav><div class="sidebar-bottom"><div class="system-label"><span class="dot"></span><span>本地工作空间</span></div><button id="collapse" title="收起或展开导航" aria-label="收起或展开导航"><i data-lucide="panel-left-close"></i><span>收起导航</span></button></div></aside>
<main><header class="topbar"><div class="breadcrumb">工作空间 <i data-lucide="chevron-right"></i><span id="breadcrumb">告警工作台</span></div><div class="top-actions"><span id="environment" class="environment">模拟环境</span><button id="connect"><span class="connection-dot"></span><span id="connection">连接后端</span></button><button id="newAlert" class="primary"><i data-lucide="plus"></i><span>接入告警</span></button></div></header>
<div class="page"><div class="page-heading"><div><div class="eyebrow">OPERATIONS CENTER</div><h1 id="pageTitle">告警工作台</h1><p id="pageSubtitle">关注异常，追踪证据，闭环处置。</p></div><div class="heading-actions"><div class="segmented" id="modeSwitch"><button data-mode="demo">模拟回放</button><button data-mode="live">后端数据</button></div><button id="refresh" class="icon-button" title="刷新数据" aria-label="刷新数据"><i data-lucide="refresh-cw"></i></button><button id="download" title="下载完整数据集"><i data-lucide="download"></i><span>数据集</span></button></div></div>
<div id="notice" role="status" aria-live="polite"></div><section id="stats" class="stats" aria-label="当前加载数据统计"></section>
<section class="content"><div class="section-bar"><div><h2 id="listTitle">告警队列</h2><span id="resultCount"></span></div><span class="muted scope">统计范围：当前加载数据</span></div><div class="filters"><label class="search"><i data-lucide="search"></i><input id="search" aria-label="搜索告警" placeholder="搜索标题、服务或编号"></label><select id="priority" aria-label="优先级"><option value="">全部优先级</option><option>P0</option><option>P1</option><option>P2</option><option>P3</option></select><select id="type" aria-label="告警类型"><option value="">全部类型</option><option value="PROBLEM">问题 · PROBLEM</option><option value="BUSINESS">业务 · BUSINESS</option><option value="EVENT">事件 · EVENT</option><option value="HOST">主机 · HOST</option></select><select id="status" aria-label="处置状态"><option value="">全部处置状态</option><option value="OPEN">待接手</option><option value="ACKNOWLEDGED">处理中</option><option value="RESOLVED">已关闭</option></select><select id="variantFilter" aria-label="回放变体" hidden><option value="">全部变体</option><option value="normal">正常取证</option><option value="timeout">工具超时</option><option value="conflict">证据冲突</option><option value="tenant_denied">跨租户拒绝</option><option value="approval">写操作待审批</option></select><button id="reset" title="重置筛选"><i data-lucide="rotate-ccw"></i><span>重置</span></button></div>
<div class="workbench" id="workbench"><section class="table-pane" aria-label="告警列表"><div id="table" class="table-scroll"></div><div id="pagination" class="pagination"></div></section><section id="detail" class="detail" aria-label="告警详情"></section></div></section><footer><span>EvoHarnessAlert <span class="footer-divider">/</span> 告警研判与处置</span><span id="footerInfo">模拟记录仅在本页有效</span></footer></div></main>
<dialog id="alertDialog"><form id="alertForm"><div class="dialog-head"><div><span class="eyebrow">ALERT INTAKE</span><h2>接入告警</h2></div><button type="button" data-close class="icon-button" aria-label="关闭"><i data-lucide="x"></i></button></div><p id="submitHint" class="form-hint"></p><label>告警原文<textarea id="rawInput" rows="6" required placeholder="例如：P0 团购下单失败率持续 5 分钟超过 60%…"></textarea></label><div class="form-row"><label>优先级<select id="inputPriority"><option>P0</option><option>P1</option><option selected>P2</option><option>P3</option></select></label><label>告警类型<select id="inputType"><option value="problem">问题 PROBLEM</option><option value="business">业务 BUSINESS</option><option value="event">事件 EVENT</option><option value="host">主机 HOST</option></select></label></div><label>服务名<input id="inputService" required value="group-buy-order-service"></label><div id="submitError" role="alert" class="error-text"></div><div class="dialog-actions"><button type="button" data-close>取消</button><button type="submit" class="primary" id="submitAlert">提交告警</button></div></form></dialog>
<dialog id="loginDialog"><form id="loginForm"><div class="dialog-head"><div><span class="eyebrow">WORKSPACE CONNECTION</span><h2>连接后端</h2></div><button type="button" data-close class="icon-button" aria-label="关闭"><i data-lucide="x"></i></button></div><p class="form-hint">连接当前站点的 API。认证信息仅在本页内存中保留。</p><label>账号<input id="username" required autocomplete="username"></label><label>密码<input id="password" type="password" required autocomplete="current-password"></label><p id="loginError" role="alert" class="error-text"></p><div class="dialog-actions"><button type="button" data-close>取消</button><button type="submit" class="primary">连接工作空间</button></div></form></dialog>
<dialog id="resolveDialog"><form id="resolveForm"><div class="dialog-head"><h2>关闭事件</h2><button type="button" data-close class="icon-button" aria-label="关闭"><i data-lucide="x"></i></button></div><p id="resolveHint" class="form-hint"></p><label>关闭备注<textarea id="resolveNote" rows="4" required placeholder="记录恢复验证、处理结果及遗留问题"></textarea></label><p id="resolveError" role="alert" class="error-text"></p><div class="dialog-actions"><button type="button" data-close>取消</button><button class="primary" type="submit">确认关闭</button></div></form></dialog>
<script src="/assets/lucide.min.js"></script><script type="module" src="/console/main.js"></script>
</body></html>
